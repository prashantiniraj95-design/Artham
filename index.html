<main>

  <!-- ── cover ───────────────────────────────────────────────────── -->
  <section class="cover" id="cover">
    <div class="cover__frame">
      <!-- the wordmark is part of the drawn logo, so the <h1> beside it is
           there for screen readers and search engines, not for looking at -->
      <img class="cover__logo" src="assets/img/logo.png"
           alt="" width="720" height="488">
      <h1 class="cover__name" data-brand-name>Artham</h1>

              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

  <!-- ── the maker ───────────────────────────────────────────────── -->
  <section class="maker" id="maker" aria-labelledby="makerHeading"></section>

  <!-- ── the tag, strung across the page before the chapters ─────── -->

  <div id="chapters"></div>

  <!-- ── care ────────────────────────────────────────────────────── -->
  <section class="care" id="care" aria-labelledby="careHeading"></section>

</main>
